<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f4f7f6; --surface:#ffffff; --surface-2:#eaf0ee; --ink:#152220; --ink-2:#4a5956; --ink-3:#7d8b88; --line:#d9e2df; --line-2:#c3cfcb;
  --bloom:#c2412d; --bloom-soft:#f4d9d4; --water:#2a78d6; --water-soft:#d6e5f8;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95; --seq-7:#0d366b;
  --tag-lever:#e87ba4; --tag-proxy:#eda100; --tag-artifact:#eb6834; --tag-state:#2a78d6;
  --shadow:0 1px 2px rgba(21,34,32,.06),0 8px 24px -12px rgba(21,34,32,.18);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#101816; --surface:#16211e; --surface-2:#1d2926; --ink:#eef3f1; --ink-2:#b3c1bd; --ink-3:#879793; --line:#2a3733; --line-2:#3a4844;
  --bloom:#e4634d; --bloom-soft:#4a2a25; --water:#3987e5; --water-soft:#1e3350;
  --seq-1:#184f95; --seq-2:#1c5cab; --seq-3:#256abf; --seq-4:#2a78d6; --seq-5:#3987e5; --seq-6:#5598e7; --seq-7:#86b6ef;
  --tag-lever:#d55181; --tag-proxy:#c98500; --tag-artifact:#d95926; --tag-state:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101816; --surface:#16211e; --surface-2:#1d2926; --ink:#eef3f1; --ink-2:#b3c1bd; --ink-3:#879793; --line:#2a3733; --line-2:#3a4844;
  --bloom:#e4634d; --bloom-soft:#4a2a25; --water:#3987e5; --water-soft:#1e3350;
  --seq-1:#184f95; --seq-2:#1c5cab; --seq-3:#256abf; --seq-4:#2a78d6; --seq-5:#3987e5; --seq-6:#5598e7; --seq-7:#86b6ef;
  --tag-lever:#d55181; --tag-proxy:#c98500; --tag-artifact:#d95926; --tag-state:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:0 96px}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;text-wrap:balance;line-height:1.1;margin:0}
h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.7rem,3.4vw,2.3rem);font-weight:650;letter-spacing:-.015em;margin-top:8px}
h3{font-size:1.25rem;font-weight:600;margin:32px 0 8px}
h4{font-size:1rem;font-weight:600;margin:20px 0 6px}
p{margin:0 0 1em;max-width:68ch}
p.lede{font-size:1.25rem;line-height:1.5;color:var(--ink-2)}
a{color:var(--water);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--water);outline-offset:2px}
code,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em}
code{background:var(--surface-2);padding:.1em .35em;border-radius:3px}
pre{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:14px 16px;overflow-x:auto;font-size:.8rem;line-height:1.5;margin:12px 0 20px}
pre code{background:none;padding:0;font-size:inherit}
.eyebrow{font-family:"Bricolage Grotesque",sans-serif;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
strong{font-weight:600}
hr.sep{border:0;border-top:1px solid var(--line);margin:48px 0}

/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:-20px;padding-inline:20px}
nav.top .row{display:flex;gap:18px;overflow-x:auto;padding-block:10px;scrollbar-width:none;font-family:"Bricolage Grotesque",sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.02em}
nav.top .row::-webkit-scrollbar{display:none}
nav.top a{color:var(--ink-2);text-decoration:none;white-space:nowrap}
nav.top a:hover{color:var(--ink)}
nav.top a span{color:var(--ink-3);margin-right:4px;font-family:"JetBrains Mono",monospace;font-weight:400}

/* hero */
header.hero{padding-block:56px 32px;display:grid;gap:22px}
header.hero .kicker{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-family:"Bricolage Grotesque",sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2)}
.pill.bloom{background:var(--bloom-soft);border-color:transparent;color:var(--bloom)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:"Bricolage Grotesque",sans-serif;font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--ink-2);margin-top:4px;line-height:1.3}
.stat .s{font-size:.72rem;color:var(--ink-3);font-family:"JetBrains Mono",monospace;margin-top:4px}

/* sections */
section{padding-block:40px 8px;scroll-margin-top:60px}
section .head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline;margin-bottom:18px}
section .head .n{font-family:"JetBrains Mono",monospace;color:var(--bloom);font-size:.9rem;padding-top:.5rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}

/* figures */
figure{margin:20px 0 28px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 12px 10px;box-shadow:var(--shadow)}
figure .ft{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.95rem;margin:0 4px 2px}
figure .fs{font-size:.8rem;color:var(--ink-2);margin:0 4px 8px}
figure figcaption{font-size:.82rem;color:var(--ink-2);margin:8px 4px 0;line-height:1.45;max-width:none}
.chart{width:100%;min-height:280px}
.chart.tall{min-height:460px}
.chart.short{min-height:220px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--ink-2);margin:2px 4px 8px;font-family:"Bricolage Grotesque",sans-serif}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0 22px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:"Bricolage Grotesque",sans-serif;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.mono{font-size:.8rem}
.tblwrap{overflow-x:auto}
.tag{display:inline-block;font-family:"Bricolage Grotesque",sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;color:#fff}
.tag.lever{background:var(--tag-lever)} .tag.proxy{background:var(--tag-proxy);color:#1a1200} .tag.artifact{background:var(--tag-artifact)} .tag.state{background:var(--tag-state)}

/* callouts */
.note{border-left:3px solid var(--water);background:var(--surface);padding:12px 16px;margin:18px 0;border-radius:0 6px 6px 0;font-size:.95rem}
.note.warn{border-color:var(--bloom)}
.note p:last-child{margin-bottom:0}
.note .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;color:var(--ink-2)}
.analogy{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:16px 0 24px}
.analogy>div{background:var(--surface);padding:12px 14px;font-size:.92rem}
.analogy .h{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.analogy .k{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.78rem;color:var(--ink-3);display:block;margin-bottom:2px}
@media (max-width:600px){.analogy{grid-template-columns:1fr}}

/* coverage heatmap */
.heat{display:grid;gap:2px;font-size:.7rem;font-family:"JetBrains Mono",monospace;color:var(--ink-2);overflow-x:auto}
.heat .c{height:18px;border-radius:2px;min-width:14px}
.heat .rl{padding-right:8px;white-space:nowrap;line-height:18px;font-family:"Bricolage Grotesque",sans-serif}
.heat .yl{writing-mode:vertical-rl;transform:rotate(180deg);line-height:14px;font-size:.62rem}

/* controls */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;font-family:"Bricolage Grotesque",sans-serif;font-size:.8rem;font-weight:600}
.seg button{background:var(--surface);color:var(--ink-2);border:0;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 4px 10px}

/* case cards */
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.cases{grid-template-columns:1fr}}
.case{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 12px 8px;box-shadow:var(--shadow)}
.case .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 4px 4px}
.case .hd b{font-family:"Bricolage Grotesque",sans-serif;font-size:1rem}
.case .meta{font-size:.78rem;color:var(--ink-2);margin:0 4px 6px;line-height:1.45}
.case .p{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:-.02em}

/* playbook */
.play{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 0 24px}
.play>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.play .h{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.play ul{margin:0;padding-left:18px;font-size:.9rem}
.play li{margin-bottom:4px}
ul.plain{padding-left:20px;max-width:70ch} ul.plain li{margin-bottom:6px}
ol.plain{padding-left:22px;max-width:70ch} ol.plain li{margin-bottom:8px}
footer{margin-top:64px;border-top:1px solid var(--line);padding-top:20px;font-size:.82rem;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
<style>/*__GROUP_CSS__*/</style>
</head><body>
<div class="wrap">
<nav class="top" aria-label="Sections"><div class="row" id="nav"></div></nav>
<header class="hero" id="hero"></header>
<main id="sections"></main>
<footer id="footer"></footer>
</div>
<script id="site-data" type="application/json">__SITE_DATA__</script>
<script id="site-copy" type="application/json">__SITE_COPY__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.1.0/plotly-basic.min.js"></script>
<script>
(function(){
// atlantis_core.site template (M-1b-ii-b). Structure, style and generic renderers only: every word is the instance's
// site_copy.yaml (C), every number the assembled site data (D). Ported from the first exemplar's v0 page.
const D = JSON.parse(document.getElementById('site-data').textContent);
const C = JSON.parse(document.getElementById('site-copy').textContent);
const S = C.strings, EV = D.event, H = EV.horizon;
const FEAT = Object.fromEntries(D.features.map(f=>[f.name,f]));
const GROUPS = D.groups.map(g=>g.id), GLABEL = Object.fromEntries(D.groups.map(g=>[g.id,g.label]));
GLABEL.availability = S.availability_group;
const UNIT = Object.fromEntries(D.units.map(u=>[String(u.id),u.name]));
const uname = id => UNIT[String(id)] ?? String(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const tok = () => ({bg:css('--surface'),ink:css('--ink'),ink2:css('--ink-2'),ink3:css('--ink-3'),line:css('--line'),bloom:css('--bloom'),water:css('--water'),
  accent:css('--tag-artifact'), g:Object.fromEntries(GROUPS.map(g=>[g,css('--g-'+g)]).concat([['availability',css('--tag-artifact')]])),
  seq:[1,2,3,4,5,6,7].map(i=>css('--seq-'+i))});
const get = (o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const fmt = (v,f)=>{ if(v==null||Number.isNaN(v)) return '—';
  switch(f){case '4':return v.toFixed(4);case '2':return v.toFixed(2);case '3':return v.toFixed(3);case '1':return v.toFixed(1);case 'pct0':return Math.round(v*100)+'%';case 'pct1':return (v*100).toFixed(1)+'%';
  case 'comma':return Math.round(v).toLocaleString('en-US');case 'k':return (v/1000).toFixed(0)+'k';case 'sci':return v.toExponential(1);case 'label':return FEAT[v]?FEAT[v].label:v;default:return String(v);}};
const compact = v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'k':String(Math.round(v));
const STYLE = {compact, fixed1:v=>v.toFixed(1), fixed2:v=>v.toFixed(2), signed2:v=>(v>=0?'+':'')+v.toFixed(2), int:v=>String(Math.round(v))};
const rule = f => D.vital_display.find(r=>new RegExp(r.match).test(f)) || {style:'fixed2'};
const inv = (r,v) => r.inverse==='log10p1' ? Math.pow(10,v)-1 : v;
const fmtx = (f,v)=>{ const r=rule(f); return STYLE[r.style||'fixed2'](inv(r,v))+(r.unit?' '+r.unit:''); };
const fsig = v => v==null ? '—' : STYLE[D.signal_display.style||'fixed2'](v)+(D.signal_display.unit?' '+D.signal_display.unit:'');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- figures: scaffolds the copy places with {{fig:NAME}}; words from C.figures.NAME ----------
const ctl = id => `<div class="ctl"><span class="eyebrow">${S.episode}</span><div class="seg" id="${id}" role="group" aria-label="${S.episode}"></div></div>`;
const FIGS = {
  peryear:'<div id="c_peryear" class="chart short"></div>', map:'<div id="c_map" class="chart short"></div>', cov:'<div id="c_cov" class="heat"></div>',
  trace:'<div id="c_trace" class="chart tall"></div>', label_diagram:'<div id="c_label"></div>',
  split:`<div id="c_split" class="chart short" style="min-height:150px"></div><div class="tblwrap"><table class="tbl" id="t_splits"><tr><th>Split</th><th>Years</th><th class="r">${S.unit_weeks}</th><th class="r">Onsets</th><th class="r">Prevalence</th>${D.metrics.calibration_in_the_large?`<th class="r">${S.citl}</th>`:''}</tr></table></div>`,
  pr:'<div id="c_pr" class="chart short"></div>', roc:'<div id="c_roc" class="chart short"></div>', cal:'<div id="c_cal" class="chart short"></div>',
  alerts:'<div class="tblwrap"><table class="tbl" id="t_alerts"><tr><th>Alert rate</th><th class="r">Threshold</th><th class="r">Precision</th><th class="r">Recall</th><th class="r">Alerts</th></tr></table></div>',
  lead:'<div id="c_lead" class="chart short"></div>', roll:'<div id="c_roll" class="chart short"></div>',
  bar:'<div id="c_bar" class="chart tall"></div>', gbar:'<div id="c_gbar" class="chart short" style="min-height:250px"></div>',
  t2:'<div class="tblwrap"><table class="tbl" id="t_t2"><tr><th>Learner</th><th class="r">Test AUROC</th><th class="r">Test AUPRC</th><th class="r">Precision at the lead budget</th></tr></table></div><div id="c_t2" class="chart short" style="min-height:240px"></div><div id="t2_avail"></div>',
  bee:'<div id="c_bee" class="chart tall" style="min-height:560px"></div>',
  strip:'<div id="c_strip" class="chart tall" style="min-height:620px"></div>', whatif:'<div id="c_whatif" class="chart"></div>',
};
const RAW = {dependence:'<div id="c_dep" class="grid3"></div>', cases:'<div class="cases" id="cases_wrap"></div>'};
const DYN = {strip:['strip_title','strip_cap','strip_seg'], whatif:['wi_title','wi_cap','wi_seg']};
function figure(name){
  if (RAW[name]) return RAW[name];
  if (!(name in FIGS)) throw new Error('unknown figure '+name);
  const w = C.figures[name] || {}, d = DYN[name];
  const ft = d ? `<div class="ft" id="${d[0]}"></div>` : (w.title ? `<div class="ft">${X(w.title)}</div>` : '');
  const fs = w.sub ? `<div class="fs">${X(w.sub)}</div>` : '';
  const cap = d ? `<figcaption id="${d[1]}"></figcaption>` : (w.caption ? `<figcaption>${X(w.caption)}</figcaption>` : '');
  return (d ? ctl(d[2]) : '') + `<figure>${ft}${fs}${FIGS[name]}${cap}</figure>`;
}
function X(s){ return String(s).replace(/\{\{fig:(\w+)\}\}/g,(m,n)=>figure(n))
  .replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,(m,p,f)=>`<span data-v="${p}"${f?` data-f="${f}"`:''}></span>`); }

// ---------- page: nav · hero · sections · footer, all from the copy ----------
document.getElementById('nav').innerHTML = C.sections.map((s,i)=>`<a href="#${s.id}"><span>${i+1}</span>${s.nav}</a>`).join('');
const hero = C.hero;
document.getElementById('hero').innerHTML = `<div class="kicker">${hero.pills.map(p=>`<span class="pill${p.accent?' bloom':''}">${X(p.text)}</span>`).join('')}</div>
  <h1>${X(hero.h1)}</h1><p class="lede">${X(hero.lede)}</p>
  <div class="stats">${hero.stats.map(s=>`<div class="stat"><div class="v num">${X(s.v)}</div><div class="l">${X(s.l)}</div><div class="s">${X(s.s)}</div></div>`).join('')}</div>`;
document.getElementById('sections').innerHTML = C.sections.map((s,i)=>`<section id="${s.id}"><div class="head"><div class="n">${String(i+1).padStart(2,'0')}</div><div><div class="eyebrow">${X(s.eyebrow)}</div><h2>${X(s.title)}</h2></div></div>\n${X(s.body)}</section>`).join('\n');
document.getElementById('footer').innerHTML = X(C.footer);
D.metrics.full.learner_kind = D.shap.learner_kind;
function bindValues(root){ root.querySelectorAll('[data-v]').forEach(el=>{el.textContent=fmt(get(D,el.dataset.v),el.dataset.f);}); }
bindValues(document);

// ---------- Plotly base layout ----------
function L(extra){ const t=tok(); return Object.assign({paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'"Bricolage Grotesque",sans-serif',size:12,color:t.ink2},
  margin:{l:48,r:14,t:10,b:40},hovermode:'closest',hoverlabel:{bgcolor:t.bg,bordercolor:t.line,font:{color:t.ink,family:'"JetBrains Mono",monospace',size:11}},
  xaxis:{gridcolor:t.line,zerolinecolor:t.line,linecolor:t.line,tickfont:{color:t.ink3}},yaxis:{gridcolor:t.line,zerolinecolor:t.line,linecolor:t.line,tickfont:{color:t.ink3}},
  legend:{orientation:'h',y:1.12,x:0,font:{size:11}},showlegend:false},extra||{});}
const CFG={displayModeBar:false,responsive:true};
const charts=[];
function plot(id,traces,layout){ const el=document.getElementById(id); if(!el) return; Plotly.react(el,traces,layout,CFG); }
function reg(fn){charts.push(fn); fn();}
const has = id => !!document.getElementById(id);
const logRange = vals => { const v=vals.filter(x=>x!=null&&x>0); return [0, Math.ceil(Math.log10(Math.max(10,...v))*10)/10+0.2]; };
const pctl = arr => { const vals=arr.filter(v=>v!=null).slice().sort((a,b)=>a-b); return v=>{ if(v==null) return null; let lo=0,hi=vals.length; while(lo<hi){const m=(lo+hi)>>1; if(vals[m]<v) lo=m+1; else hi=m;} return lo/vals.length; }; };
const sp = D.split, y0 = sp.min_train_year-0.5;

// ---------- data ----------

  top.forEach((f,fi)=>{ const k=B.features.indexOf(f); const sv=B.shap[k], xv=B.x[k]; const pct=pctl(xv);
    const jit=sv.map((v,i)=>{ const h=Math.sin(i*12.9898+fi*78.233)*43758.5453; const u=h-Math.floor(h); return (u-0.5)*0.72; });
    traces.push({type:'scatter',mode:'markers',x:sv,y:jit.map(j=>fi+j),marker:{size:4,opacity:.75,color:xv.map(pct),colorscale:[[0,t.seq[0]],[0.5,t.seq[3]],[1,t.seq[6]]],cmin:0,cmax:1,line:{width:0}},
      text:xv.map(v=>v==null?'missing':(+v).toFixed(2)),hovertemplate:FEAT[f].label+'<br>value %{text}<br>SHAP %{x:.2f}<extra></extra>',showlegend:false});
    const mi=xv.map((v,i)=>v==null?i:-1).filter(i=>i>=0); if(mi.length) traces.push({type:'scatter',mode:'markers',x:mi.map(i=>sv[i]),y:mi.map(i=>fi+jit[i]),marker:{size:4,color:'rgba(0,0,0,0)',line:{width:1,color:t.ink3}},hovertemplate:FEAT[f].label+'<br>value missing<br>SHAP %{x:.2f}<extra></extra>',showlegend:false});
  });
  plot('c_bee',traces,L({margin:{l:170,r:14,t:6,b:40},height:560,xaxis:{title:{text:'SHAP value (log-odds); right = pushes toward onset'},gridcolor:t.line,zerolinecolor:t.ink3,tickfont:{color:t.ink3}},
    yaxis:{tickvals:top.map((f,i)=>i),ticktext:top.map(f=>FEAT[f].label),tickfont:{size:11,color:t.ink2},gridcolor:t.line,range:[-.6,top.length-.4]}}));
  const wrap=document.getElementById('c_dep'); if(!wrap) return; wrap.innerHTML='';
  D.shap.top6.forEach((f,i)=>{ const d=D.shap.dependence[f]; const fig=document.createElement('figure'); fig.innerHTML=`<div class="ft">${FEAT[f].label}</div><div class="fs">colour: ${FEAT[d.partner].label} (light = low, dark = high)</div><div id="c_dep_${i}" class="chart short"></div>`; wrap.appendChild(fig);
    const pct=pctl(d.partner_x);
    plot('c_dep_'+i,[{type:'scatter',mode:'markers',x:d.x,y:d.shap,marker:{size:4,opacity:.7,color:d.partner_x.map(pct),colorscale:[[0,t.seq[0]],[0.5,t.seq[3]],[1,t.seq[6]]],cmin:0,cmax:1,line:{width:0}},text:d.partner_x.map(v=>v==null?'missing':(+v).toFixed(2)),hovertemplate:FEAT[f].label+' %{x:.2f}<br>SHAP %{y:.2f}<br>'+FEAT[d.partner].label+' %{text}<extra></extra>'}],
      L({margin:{l:44,r:10,t:6,b:36},xaxis:{title:{text:FEAT[f].label,font:{size:11}},gridcolor:t.line,tickfont:{color:t.ink3}},yaxis:{title:{text:'SHAP',font:{size:11}},gridcolor:t.line,zerolinecolor:t.ink3,tickfont:{color:t.ink3}}}));
  });
});

// ---------- cases ----------
reg(()=>{ const t=tok(); const wrap=document.getElementById('cases_wrap'); if(!wrap) return; wrap.innerHTML='';
  const TT={true_positive:'True positive, early',false_positive:'False alarm',quiet:'Quiet week'};
  D.shap.cases.forEach((c,ci)=>{ const card=document.createElement('div'); card.className='case';
    const ent=Object.entries(c.shap).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])); const top=ent.slice(0,9), rest=ent.slice(9).reduce((s,e)=>s+e[1],0);
    const items=top.map(([f,v])=>({l:FEAT[f].label+' = '+(c.x[f]==null?'missing':fmtx(f,c.x[f])),v})); items.push({l:`other ${ent.length-9} features`,v:rest});
    const outcome=c.tag==='quiet'?S.event_not_followed:(c.y?`${S.event_followed} (${fsig(c.future_signal)} within ${H} wk${c.lead_weeks?', first crossed '+c.lead_weeks+' wk later':''})`:`${S.event_not_followed} (${EV.direction==='below'?'min':'max'} ${c.future_signal==null?'unknown':fsig(c.future_signal)})`);
    card.innerHTML=`<div class="hd"><b>${TT[c.tag]}</b><span class="p num" style="color:${c.y?'var(--bloom)':'var(--ink-2)'}">${(c.p*100).toFixed(0)}%</span></div><div class="meta">${c.unit_name} · week of ${c.week}<br>${S.case_this_week}: ${c.signal_this_week==null?S.no_obs:fsig(c.signal_this_week)}<br>outcome: ${outcome}</div><div id="c_case_${ci}" class="chart" style="min-height:340px"></div>`;
    wrap.appendChild(card);
    let cum=D.shap.base_logit; const xs=[],bases=[],cols=[],labels=[],hover=[];
    items.forEach(it=>{ labels.push(it.l); bases.push(Math.min(cum,cum+it.v)); xs.push(Math.abs(it.v)); cols.push(it.v>=0?t.bloom:t.water); hover.push((it.v>=0?'+':'')+it.v.toFixed(2)+' log-odds'); cum+=it.v; });
    const sig=z=>1/(1+Math.exp(-z));
    plot('c_case_'+ci,[{type:'bar',orientation:'h',y:labels,x:xs,base:bases,marker:{color:cols},text:hover,hovertemplate:'%{y}<br>%{text}<extra></extra>',textposition:'none'}],
      L({margin:{l:150,r:10,t:18,b:34},height:340,bargap:.25,yaxis:{autorange:'reversed',tickfont:{size:10,color:t.ink2}},xaxis:{title:{text:'log-odds',font:{size:11}},gridcolor:t.line,tickfont:{color:t.ink3},zerolinecolor:t.line},
        shapes:[{type:'line',x0:D.shap.base_logit,x1:D.shap.base_logit,y0:0,y1:1,yref:'paper',line:{color:t.ink3,dash:'dot',width:1}},{type:'line',x0:cum,x1:cum,y0:0,y1:1,yref:'paper',line:{color:c.y?t.bloom:t.ink2,width:1.5}}],
        annotations:[{x:D.shap.base_logit,y:1,yref:'paper',text:'base '+(sig(D.shap.base_logit)*100).toFixed(1)+'%',showarrow:false,yanchor:'bottom',font:{size:10,color:t.ink3}},{x:cum,y:1,yref:'paper',text:'score '+(sig(cum)*100).toFixed(0)+'%',showarrow:false,yanchor:'bottom',font:{size:10,color:t.ink}}]}));
  });
});

// ---------- risk strip ----------
const SK = Object.keys(D.shap.strips); const stripSeg=document.getElementById('strip_seg');
if(stripSeg) SK.forEach((k,i)=>{const b=document.createElement('button'); b.dataset.k=k; b.setAttribute('aria-pressed',i===0); b.textContent=(C.strips[k]||{}).label||k; stripSeg.appendChild(b);});
function drawStrip(k){ if(!has('c_strip')) return; const t=tok(); const s=D.shap.strips[k]; document.getElementById('strip_title').textContent=s.unit_name+' — '+s.weeks[0].slice(0,7)+' to '+s.weeks[s.weeks.length-1].slice(0,7); document.getElementById('strip_cap').innerHTML=X((C.strips[k]||{}).caption||''); bindValues(document.getElementById('strip_cap'));
  const tr=[]; const onset=s.weeks.map((w,i)=>s.y[i]===1?s.p[i]:null); const sigv=s.signal.map(v=>v==null?null:(D.signal_display.log_axis?Math.max(v,1):v));
  tr.push({type:'scatter',mode:'lines',x:s.weeks,y:s.p,name:`P(onset within ${H} wk)`,line:{color:t.ink,width:2},fill:'tozeroy',fillcolor:t.bloom+'1f',hovertemplate:'%{x}<br>P = %{y:.2f}<extra></extra>'});
  tr.push({type:'scatter',mode:'markers',x:s.weeks,y:onset,name:S.event_followed,marker:{color:t.bloom,size:8,symbol:'diamond'},hovertemplate:'%{x}<br>'+esc(S.event_followed)+' · P = %{y:.2f}<extra></extra>'});
  tr.push({type:'scatter',mode:'lines+markers',x:s.weeks,y:sigv,yaxis:'y2',name:S.trace_panels.signal.name,line:{color:t.bloom,width:1.5},marker:{size:4},connectgaps:false,hovertemplate:'%{x}<br>%{y:,.0f}<extra></extra>'});
  GROUPS.forEach(g=>tr.push({type:'bar',x:s.weeks,y:s.groups[g],yaxis:'y3',name:GLABEL[g],marker:{color:t.g[g]},hovertemplate:'%{x}<br>'+esc(GLABEL[g])+' %{y:+.2f}<extra></extra>'}));
  const shapes=[{type:'line',xref:'paper',x0:0,x1:1,yref:'y2',y0:EV.threshold,y1:EV.threshold,line:{color:t.ink3,dash:'dot',width:1}}];
  (s.bands||[]).forEach(([a,b])=>shapes.push({type:'rect',xref:'x',x0:a,x1:b,yref:'paper',y0:0,y1:1,fillcolor:t.ink3,opacity:.12,line:{width:0},layer:'below'}));
  plot('c_strip',tr,L({barmode:'relative',bargap:.15,showlegend:true,legend:{orientation:'h',y:-.08,x:0,font:{size:10}},margin:{l:56,r:14,t:10,b:70},height:620,
    yaxis:{title:{text:'P(onset)'},domain:[.72,1],range:[0,1],gridcolor:t.line,tickfont:{color:t.ink3}},
    yaxis2:Object.assign({title:{text:S.trace_panels.signal.axis},domain:[.46,.68],gridcolor:t.line,tickfont:{color:t.ink3}},D.signal_display.log_axis?{type:'log',range:logRange(sigv)}:{}),
    yaxis3:{title:{text:'SHAP by group, net (log-odds)'},domain:[0,.42],gridcolor:t.line,zerolinecolor:t.ink3,tickfont:{color:t.ink3}},
    xaxis:{gridcolor:t.line,tickfont:{color:t.ink3},showgrid:false},shapes}));
}
let stripK=SK[0]; reg(()=>drawStrip(stripK));
if(stripSeg) stripSeg.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; stripK=b.dataset.k; [...stripSeg.children].forEach(x=>x.setAttribute('aria-pressed',x===b)); drawStrip(stripK);});

// ---------- what-if ----------
const wiKeys=Object.keys(D.whatif); const wiSeg=document.getElementById('wi_seg');
if(wiSeg) wiKeys.forEach((k,i)=>{const b=document.createElement('button'); b.dataset.k=k; b.setAttribute('aria-pressed',i===0); const w=D.whatif[k]; b.textContent=w.unit_name+' '+w.weeks[0].slice(0,4)+'–'+w.weeks[w.weeks.length-1].slice(2,4)+(w.split.every(s=>s==='test')?' (held out)':' (in-sample)'); wiSeg.appendChild(b);});
function drawWI(k){ if(!has('c_whatif')) return; const t=tok(); const w=D.whatif[k]; document.getElementById('wi_title').textContent=w.unit_name+' — '+w.weeks[0].slice(0,7)+' to '+w.weeks[w.weeks.length-1].slice(0,7);
  const nl=w.non_lever_labels||[];
  document.getElementById('wi_cap').textContent=`Mean change in predicted probability across the episode: ${(w.mean_delta*100).toFixed(1)} percentage points (mean absolute change ${(w.mean_abs_delta*100).toFixed(1)} pp). ${w.mean_delta<0?S.whatif_down:S.whatif_not_down} — under the caveats below.`+(w.only_non_lever?` ${S.whatif_only_non_lever} ${nl.join(', ')}.`:(nl.length?` ${S.whatif_non_lever} ${nl.join(', ')}.`:''));
  plot('c_whatif',[{type:'scatter',mode:'lines',x:w.weeks,y:w.p_actual,name:'actual',line:{color:t.ink,width:2},hovertemplate:'%{x}<br>actual P = %{y:.2f}<extra></extra>'},
    {type:'scatter',mode:'lines',x:w.weeks,y:w.p_scenario,name:S.whatif_scenario,line:{color:t.g[w.group]||t.water,width:2,dash:'dot'},hovertemplate:'%{x}<br>'+esc(S.whatif_scenario)+' P = %{y:.2f}<extra></extra>'},
    {type:'scatter',mode:'markers',x:w.weeks,y:w.weeks.map((x,i)=>w.y[i]===1?w.p_actual[i]:null),name:S.event_followed,marker:{color:t.bloom,size:8,symbol:'diamond'},hovertemplate:'%{x}<br>'+esc(S.event_followed)+'<extra></extra>'}],
    L({showlegend:true,legend:{orientation:'h',y:1.15,x:0},yaxis:{title:{text:`P(onset within ${H} wk)`},range:[0,1],gridcolor:t.line,tickfont:{color:t.ink3}},xaxis:{gridcolor:t.line,tickfont:{color:t.ink3},showgrid:false}}));
}
let wiK=wiKeys[0]; if(wiK) reg(()=>drawWI(wiK));
if(wiSeg) wiSeg.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; wiK=b.dataset.k; [...wiSeg.children].forEach(x=>x.setAttribute('aria-pressed',x===b)); drawWI(wiK);});

// ---------- theme change → redraw ----------
const mq=window.matchMedia('(prefers-color-scheme: dark)'); const redraw=()=>charts.forEach(f=>f());
mq.addEventListener?mq.addEventListener('change',redraw):mq.addListener(redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
</body></html>
