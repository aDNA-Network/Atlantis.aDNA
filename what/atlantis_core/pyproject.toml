[project]
name = "atlantis-core"
version = "0.1.0"
description = "Atlantis reference implementation — registries → vitals → direction-aware label, with the all-stream leakage self-test (P1 M-1b-i)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [   # pinned to the exemplar's lock (M-1a) so the equivalence test compares like with like
  "numpy==2.5.3",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "requests==2.34.2",
]

[project.optional-dependencies]
validate = ["jsonschema>=4"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlantis_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
