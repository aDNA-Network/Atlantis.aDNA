[project]
name = "hab-crash-risk"
version = "0.1.0"
description = "Karenia brevis bloom-onset early warning — the Atlantis exemplar (sepsis analog: vitals → calibrated onset model → interventional SHAP)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "scikit-learn==1.9.1",
  "shap==0.52.0",
  "xgboost==3.4.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
