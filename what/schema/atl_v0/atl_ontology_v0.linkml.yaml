# atl_ontology_v0.linkml.yaml — Atlantis.aDNA · the `atl_` ontology for ecosystem early warning, v0
#
# STATUS: draft (v0.9.0) — authored at M-0 (2026-10-02, fable); CONTROLLED at P1 M-1c (2026-10-02, opus); 0.3.0 at M-1d-i
# (2026-10-03, operator ruling): a stream may be DECLARED before it is fetched — `ingested_at` optional, and a hash ⇒ a fetch time.
# 0.4.0 at M-1e (2026-10-03, operator ruling; F-8): an alert budget says where its threshold was fixed (`threshold_from`), and a
# threshold fixed on validation ⇒ the REALISED test alert rate is stated beside the nominal `rate`. 0.5.0 at M-2a-i (2026-10-06):
# `refractory_weeks` on an event. 0.6.0 at M-1f (2026-10-07, operator ruling): an evaluation may state the label-horizon
# embargo its fit and stop sets were cut with (`embargo_weeks`). 0.7.0 at M-2b (2026-10-08, steward rulings 19–20): two no-model
# comparators beside climatology (`persistence_*`, `trend_*`) and the base rate and calibration-in-the-large per segment
# (`base_rate_train`, `base_rate_validation`, `calibration_in_the_large_*`; ruling 16). 0.8.0 at M-2c-i (2026-10-08; P2 gate
# III G-3, C-034): T11 at its terms — climatology scored at the model's budgets with thresholds fixed on validation
# (`climatology_alert_budgets`, reusing AtlAlertBudget and its realised-rate rule), and a season-block paired interval for
# model − comparator (`paired_intervals`, AtlPairedInterval; resampled by test season, never by row). 0.9.0 at M-3b-i
# (2026-10-12, operator rulings 1–3): the hypothesis ledger — AtlHypothesis (one literature claim, pointing at a sentence,
# realisable as a vital) with its inlined driver · lag · threshold · citation · realisation, and EcosystemType bound to
# ENVO biome terms (the ledger's join key; crosswalk row envo). A constraint
# is claimed ONLY where a control in fixtures/controls/ proves it under all three worlds of run_controls.sh
# (linkml-validate · the committed atl_ontology_v0.schema.json, descendants OFF · a scratch JSON Schema, descendants ON).
# The control count and the known limits are in README.md. A constraint whose docstring names no control is NOT claimed.
#
# Rules adopted from ASOAtlas.aDNA/what/schema/aso_v0 (the fleet's worked LinkML precedent), in force from M-1c:
#   1. A constraint is claimed ONLY if BOTH validators enforce it — linkml-validate AND the committed JSON Schema.
#   2. Every enum below is a row in a vocabulary fit matrix (M-1c artifact), sourced to the external authority the
#      crosswalk names, or marked `local` with the reason.
#   3. A constraint's docstring says what its control proves and names the nearest miss it does NOT catch.
#   4. No class that is the RANGE of a slot has a concrete descendant (flag-proof under include_range_class_descendants).
#
# Authoring idiom: LinkML (aDNA.aDNA ADR-062, `proposed` — preferred-but-optional). Validated in a scratch venv, never
# installed on the node. Namespace `atl_` per what/ontology.md §Extension Patterns (additive, WHAT leg).
#
# Five classes, chosen by the instance / independence / lifecycle tests (context_adna_core_ontology_workshop):
#   AtlSpatialUnit · AtlObservationStream · AtlVital · AtlEventDefinition · AtlEvaluation.
# Deliberately NOT classes in v0 (README §Dropped): Patient×TimeStep, Observation, Label (table shapes → type
# vocabulary); Model (→ RareArchive model.schema.json / Ray RayJobRecord by reference); Hypothesis (added 0.9.0, P3 M-3b-i);
# Steward, Instance (governance documents); BoardEntry (the board's own schema, which embeds AtlEvaluation).

id: https://w3id.org/adna/atlantis/atl_v0
name: atl_ontology_v0
title: Atlantis atl_ ontology v0 — ecosystem early warning (sepsis analog)
description: >-
  The five entities a regional early-warning instance declares so that a reviewer can conform it without seeing
  its data, and so that evaluations from different instances are comparable on the Atlantis evidence board with
  no data moving. A spatial unit (the patient's space), an observation stream (a source with provenance), a vital
  (a feature with a tag and a lineage), an event definition (threshold · direction · horizon), and an evaluation
  (the measurement, always against its base rate). Observations, labels and predictions are table shapes, not
  entities, and never cross into Atlantis.
version: 0.9.0
license: https://opensource.org/licenses/MIT
status: draft

prefixes:
  linkml: https://w3id.org/linkml/
  atl: https://w3id.org/adna/atlantis/atl_v0/
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  WDPA: https://www.protectedplanet.net/
  CF: https://vocab.nerc.ac.uk/standard_name/
  UCUM: https://ucum.org/ucum#
  WoRMS: https://www.marinespecies.org/aphia.php?p=taxdetails&id=
  dwc: http://rs.tdwg.org/dwc/terms/
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  NOAACRW: https://coralreefwatch.noaa.gov/product/5km/   # 0.5.0 (M-2a-i): crosswalk row noaa_crw_products — DHW has no CF standard name
default_prefix: atl
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------------------------------------------
# Enums — each is a row in the M-1c fit matrix. `local` = no external authority adopted; reason in the description.
# ---------------------------------------------------------------------------------------------------------------
enums:

  UnitKind:
    # Closed. Control: neg_unknown_unit_kind (an unlisted value rejected AT its slot). Nearest miss NOT caught: a listed value that is wrong for the instance.
    description: >-
      The kind of spatial unit a patient is. local — no external vocabulary enumerates "the unit a steward
      manages"; `mpa_zone` is bound to WDPA/MPAtlas ids through AtlSpatialUnit.external_id, not through this enum.
    permissible_values:
      mpa_zone:        {description: "A zone or the whole of a marine protected area; external_id SHOULD be a WDPA id"}
      coastal_band:    {description: "An alongshore band defined by a coordinate rule (the exemplar's 9 Florida regions)"}
      reef:            {description: "A reef or reef tract"}
      estuary_segment: {description: "A segment of an estuary or bay"}
      river_reach:     {description: "A river reach between gauges or confluences"}
      grid_cell:       {description: "A regular cell of a gridded product (the patient when vitals are gridded-only)"}
  TimeStep:
    # Closed. Control: neg_unknown_time_step (an unlisted value rejected AT its slot). Nearest miss NOT caught: a listed value that is wrong for the instance.
    description: The patient's time step. local — ISO 8601 durations would over-specify; `cruise` is irregular by design.
    permissible_values:
      day: {}
      iso_week: {description: "Monday-keyed ISO week (the exemplar)"}
      fortnight: {}
      month: {}
      cruise: {description: "Irregular — one step per sampling cruise (metagenomic / survey instances)"}
  Modality:
    # Closed. Control: neg_unknown_modality (an unlisted value rejected AT its slot). Nearest miss NOT caught: a listed value that is wrong for the instance.
    description: >-
      How a stream speaks. local, informed by GOOS EOV platform classes (not bound in v0 — crosswalk row 7).
    permissible_values:
      point_count:   {description: "Discrete samples with a measured abundance (cells/L, CPUE, colony counts)"}
      gridded_field: {description: "A satellite or model field on a lat/lon grid (SST, chlorophyll, DHW)"}
      gauge_series:  {description: "A fixed-station time series on land or at a structure (discharge, DO at a gate)"}
      buoy_series:   {description: "A moored or drifting platform's time series (wind, waves, water temperature)"}
      edna_profile:  {description: "eDNA / metagenomic taxon-abundance profiles per sample event"}
      acoustic:      {description: "Passive or active acoustic observations"}
      survey_log:    {description: "Human survey or transect logs (bleaching surveys, fish counts, kills)"}
      literature:    {description: Papers and agency reports — a stream whose "observations" are hypotheses (P3)}

  VitalTag:
    description: >-
      What a feature is FOR a steward. local — this is the method's own vocabulary (pattern step 8). A tag is a
      human bridge to action; it is never a causal claim.
    permissible_values:
      lever:    {description: "Something a named owner can change (a gate's discharge, a closure, an effluent permit)"}
      proxy:    {description: "Environmental state nobody controls on the horizon (SST, season, wind)"}
      artifact: {description: "A property of the monitoring programme, not the ecosystem (sample counts, time since sampling)"}
      state:    {description: "The patient's own trajectory (recent maxima, growth, time since last event)"}
  Direction:
    # Closed. Control: neg_unknown_direction (an unlisted value rejected AT its slot). Nearest miss NOT caught: a listed value that is wrong for the instance.
    description: Which way the threshold crossing goes. local.
    permissible_values:
      above: {description: "Event when the variable rises to or past the threshold (bloom, DHW, temperature)"}
      below: {description: "Event when the variable falls to or past the threshold (dissolved oxygen, seagrass cover, pH)"}
  Claim:
    description: >-
      What an evaluation is allowed to claim (SO-4). local. Default is method_demonstration; the other value needs
      the instance owner's written ruling naming the agencies that run the real forecast.
    permissible_values:
      method_demonstration: {}
      operational_by_owner_ruling: {description: "Requires AtlEvaluation.owner_ruling_ref"}
  EvidenceTier:
    # Closed. Control: neg_unknown_tier (an unlisted value rejected AT its slot). Nearest miss NOT caught: a listed value that is wrong for the instance.
    description: Review tier of a declared object. local — RareArchive's draft→reviewed→validated→published ladder, minus `published` (the board is the publication).
    permissible_values:
      draft: {}
      reviewed: {}
      validated: {}
  IntervalComparator:
    # Closed. Control: neg_interval_unknown_comparator (an unlisted value rejected AT its slot). Nearest miss NOT caught: an interval computed against a different comparator than the one named (atlantis_core: board.assert_interval reads it against the result).
    description: >-
      The no-model comparator a paired interval measures the model against (0.8.0, M-2c-i). local — names a baseline of
      the method. `climatology`: the week-of-year onset rate (T11). Further comparators (persistence, trend, a
      calendar + signal logistic) are added only with their own controls.
    permissible_values:
      climatology: {}

  IntervalMetric:
    # Closed. Control: neg_interval_unknown_metric. Nearest miss NOT caught: a delta computed on a metric other than the one named.
    description: >-
      The threshold-free metric a paired interval is drawn on (0.8.0, M-2c-i). local. A budget's precision/recall are
      read beside the interval in `climatology_alert_budgets`, not inside it.
    permissible_values:
      auroc: {}
      auprc: {}

  ResampleUnit:
    # Closed, one value. Control: neg_interval_resample_unit_row (`zone_week` rejected AT its slot). Nearest miss NOT caught: an interval labelled `season_year` whose draws were rows (atlantis_core: eval.interval._take checks the very indices it scores, in the same call; plants C3 and A in tests/test_m2c.py).
    description: >-
      What a paired interval resamples (0.8.0, M-2c-i). local. `season_year`: whole seasons, each starting at the
      evaluation's `season_start_month` (1 = calendar year) — zone-weeks within a season are one event seen many times,
      so a row resample would claim an independence the data do not have.
    permissible_values:
      season_year: {}

  ThresholdSource:
    # Closed. Control: neg_unknown_threshold_from (an unlisted value rejected AT its slot). Nearest miss NOT caught: a value that misstates where the threshold was actually computed (that is caught by effect in atlantis_core/tests/test_f8.py::test_eval_thresholds_do_not_move_with_test and by the identity checks in eval._variant and board.assert_thresholds_fixed).
    description: >-
      Where an alert threshold was fixed (M-1e, F-8). local — no external vocabulary names this. `validation`: on
      scores the model was not trained on, before test was scored — the reading a steward can staff against.
      `test`: the quantile of the scored test set itself, chosen after the fact (hab's reading; grandfathered entries only).
    permissible_values:
      validation: {}
      test: {}

  EcosystemType:
    # Closed. Control: neg_hypothesis_unknown_ecosystem (an unlisted value rejected AT its slot). Nearest miss NOT caught: a listed value that is wrong for the paper (a reviewer's catch).
    description: >-
      0.9.0 (M-3b-i). The hypothesis ledger's join key across instances (hypotheses README rule 5) — a coral DHW driver
      asserted in Palau is a candidate vital in the Keys. Bound to ENVO BIOME terms (crosswalk row envo, moved from
      deferred to adopted at 0.9.0; ids looked up in OLS on 2026-10-12, none obsolete). Scope of the binding: this enum
      only — AtlSpatialUnit carries no ENVO term (its bind_when is unchanged). A new ecosystem type is a new value with
      its looked-up term.
    permissible_values:
      coral_reef:    {meaning: ENVO:01000049, description: "marine coral reef biome (FKNMS; the first ledger)"}
      estuary:       {meaning: ENVO:01000020, description: "estuarine biome"}
      neritic_pelagic: {meaning: ENVO:01000042, description: "neritic epipelagic zone biome — the WATER COLUMN over a shelf (the exemplar's K. brevis), not the seabed; renamed from neritic_shelf before any row used it (III M-3b-i F-12e)"}

  DriverDirection:
    # Closed. Control: neg_hypothesis_unknown_direction (an unlisted value rejected AT its slot). Nearest miss NOT caught: a direction that misreads the paper.
    description: >-
      0.9.0. Which way the literature says the driver moves the event's probability. local. Distinct from Direction
      (which way a threshold CROSSING goes). `threshold`: the paper names a level past which the effect appears;
      `nonmonotone`: an optimum or a U-shape.
    permissible_values:
      positive: {}
      negative: {}
      nonmonotone: {}
      threshold: {}

  LagUnit:
    # Closed. Control: neg_hypothesis_unknown_lag_unit. Nearest miss NOT caught: a lag stated in one unit and converted wrongly.
    description: 0.9.0. The unit a literature lag is stated in. local — the paper's own unit, converted to the instance's time step at realisation, not here.
    permissible_values:
      days: {}
      weeks: {}
      months: {}
      years: {}

  EvidenceClass:
    # Closed. Control: neg_hypothesis_unknown_evidence_class. Nearest miss NOT caught: an observational study filed as experimental.
    description: 0.9.0. What kind of evidence the cited work offers for the claim. local (playbook §C.2).
    permissible_values:
      observational: {}
      experimental: {}
      model: {description: "A numerical or statistical model's result (a hindcast, a GCM projection, a regression)"}
      review: {}
      agency_report: {}

  HypothesisSource:
    # Closed. Control: neg_hypothesis_unknown_source. Nearest miss NOT caught: a steward's claim filed as literature.
    description: >-
      0.9.0. Where a hypothesis came from. local. `steward_expert` carries the steward's consent to be named or is
      attributed to the instance (README rule 4); `model_finding` is a SHAP surprise promoted to a hypothesis.
    permissible_values:
      literature: {}
      steward_expert: {}
      model_finding: {}

  CitationSource:
    # Closed. Control: neg_hypothesis_unknown_citation_source. Nearest miss NOT caught: a work found by one index and filed under another.
    description: 0.9.0. The index or portal the cited work was retrieved through (provenance of the retrieval, not of the work). local.
    permissible_values:
      openalex: {}
      semantic_scholar: {}
      europe_pmc: {}
      agency: {description: "An agency portal or technical-report series (NOAA, CRW, FWC)"}

  Realisability:
    # Closed. Controls: neg_hypothesis_unknown_realisability · neg_hypothesis_without_realisability. Nearest miss NOT caught: a class that misreads the row's realisable_as (a reader's catch, skill step 6).
    description: >-
      0.9.0 (III M-3b-i F-4). How a row could be realised as a vital, as a class the index can count (T8's falsifier,
      counted by code, not by hand). local. `existing_stream`: from the instance's own streams (a vital, no fetcher).
      `declared_fetcher`: a stream whose atlantis_core fetcher is declared but not built. `new_stream`: an ordinary stream
      no fetcher yet declares (an index, a track, an ERDDAP field, a reanalysis). `unrealisable`: no public stream
      observes the driver at the patient's scale, the lag is longer than the record, or the row is the event's own
      definition (skill step 4). Instance-relative: it is read against the instance named in the ledger's hand-off memo.
    permissible_values:
      existing_stream: {}
      declared_fetcher: {}
      new_stream: {}
      unrealisable: {}

  RealisationResult:
    # Closed. Control: neg_hypothesis_unknown_result. Nearest miss NOT caught: `supported` written for a driver whose SHAP was not measured (atlantis_core.hypotheses check: a tested result needs tested_at and write_up).
    description: >-
      0.9.0. What the instance's test said. local. `not_supported` rows are kept and written up (T8; README rule 3).
      `supported` means the realised vital carried attribution as the paper predicts — never that the mechanism is true.
    permissible_values:
      untested: {}
      supported: {}
      not_supported: {}
      inconclusive: {}

# ---------------------------------------------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------------------------------------------
slots:

  # identifiers ------------------------------------------------------------------------------------------------
  # Controls (one per id slot): neg_bad_id_prefix (stream) · neg_unit_id_prefix · neg_vital_id_prefix · neg_event_id_prefix ·
  # neg_eval_id_prefix — each rejected AT its id. `(?!\n)$`: Python `re` lets a bare `$` match before a trailing newline
  # (a YAML `|` block scalar), which ECMA does not — closed at M-1c III review F-2; control neg_sha256_trailing_newline
  # exercises the same anchor on sha256. Nearest miss NOT caught: a well-formed id that is not unique, or a *_ref
  # that names no declared object (uniqueness and referential integrity are a validator's job — README §Known limits).
  unit_id:       {identifier: true, range: string, pattern: "^atl_unit_[a-z0-9_]{2,64}(?!\\n)$", description: "Instance-local id; prefix fixed so ids are greppable across instances. Control: neg_unit_id_prefix."}
  stream_id:     {identifier: true, range: string, pattern: "^atl_stream_[a-z0-9_]{2,64}(?!\\n)$", description: "Stream id. Control: neg_bad_id_prefix."}
  vital_id:      {identifier: true, range: string, pattern: "^atl_vital_[a-z0-9_]{2,64}(?!\\n)$", description: "Vital id. Control: neg_vital_id_prefix."}
  event_id:      {identifier: true, range: string, pattern: "^atl_event_[a-z0-9_]{2,64}(?!\\n)$", description: "Event-definition id. Control: neg_event_id_prefix."}
  evaluation_id: {identifier: true, range: string, pattern: "^atl_eval_[a-z0-9_]{2,64}(?!\\n)$", description: "Evaluation id. Control: neg_eval_id_prefix."}
  hyp_id:        {identifier: true, range: string, pattern: "^atl_hyp_[a-z0-9_]{2,64}(?!\\n)$", description: "0.9.0. Hypothesis id; the row's file is <hyp_id>.yaml (atlantis_core.hypotheses check). Control: neg_hypothesis_id_prefix."}

  # common -----------------------------------------------------------------------------------------------------
  name:          {range: string, description: "Human label. Never a partner site's name when the instance's posture is partner or human_subject."}
  description:   {range: string}
  tier:          {range: EvidenceTier, ifabsent: "string(draft)"}
  version:       {range: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?!\\n)$", description: "Semantic version of the declared object."}
  recorded_by:   {range: string, description: "Agent or operator id (e.g. agent_proteus, stanley)."}
  recorded_at:   {range: datetime}

  # AtlSpatialUnit ---------------------------------------------------------------------------------------------
  unit_kind:     {range: UnitKind, required: true}
  external_id:   {range: uriorcurie, description: "WDPA:<id> or MPAtlas:<id> for mpa_zone; optional otherwise. A CURIE, never a polygon."}
  geometry_ref:
    range: string
    pattern: '^(?!\s*[\[{])(?!\s*(?:[Ss][Rr][Ii][Dd]=\d+;)?(?:[Mm][Uu][Ll][Tt][Ii])?(?:[Pp][Oo][Ii][Nn][Tt]|[Ll][Ii][Nn][Ee][Ss][Tt][Rr][Ii][Nn][Gg]|[Pp][Oo][Ll][Yy][Gg][Oo][Nn]|[Gg][Ee][Oo][Mm][Ee][Tt][Rr][Yy][Cc][Oo][Ll][Ll][Ee][Cc][Tt][Ii][Oo][Nn])\s*(?:[Zz][Mm]?|[Mm])?\s*\()(?![\s\S]*-?\d{1,3}\.\d+\s*[NSns]?(?:\s*[,;]\s*|\s+)-?\d{1,3}\.\d+)[\s\S]*\S[\s\S]*$'
    description: >-
      POINTER to the geometry (a file path in the instance, a WDPA id, or a coordinate RULE string such as the
      exemplar's `lat >= 27.6`). Never inline coordinates. DENYLIST (operator ruling, M-1c): rejects a value that opens
      as a GeoJSON/array literal (`{` or `[`), opens as WKT/EWKT (POINT · LINESTRING · POLYGON · MULTI* ·
      GEOMETRYCOLLECTION, any case, optional SRID=n; and Z/M), contains a decimal lat,lon pair anywhere (separated by
      `,` `;` or whitespace, optional N/S on the first number), or is blank. ONE CONTROL PER ARM, each built to evade
      every other arm (III review F-1; each arm's removal turns exactly its control red — M-1c AAR):
      neg_geometry_arm_brace (`{…}` with integer coords) · neg_geometry_arm_wkt (`POINT(-80 25)`, integers) ·
      neg_geometry_arm_ewkt_case (`srid=4326;point(-80 25)`) · neg_geometry_arm_pair (`see 25.1, -80.4`) ·
      neg_geometry_arm_blank (`'  '`); realistic composites: neg_inline_geometry_wkt · _geojson · _bbox (the
      exemplar's own region_boxes row). Nearest misses NOT caught: integer-only or DMS coordinates (`25 -80`,
      `25°07′N 80°24′W`); query-string pairs (`lat=27.6&lon=-82.5`); projected/UTM metres with one decimal side
      (`456789 3045678.9`); WKT after a newline with integer coords. FALSE REJECTS (by design, named): any two
      decimals side by side — an interval rule `lat in [24.5, 27.6)` (write it as the exemplar's grammar does:
      `lat >= 24.5 and lat < 27.6`), a path like `regions_v1.2 3.4.gpkg`, prose like `release 2.1 3.0`. A pointer to a
      file that itself holds partner coordinates passes by design — the file lives in the instance.
  time_step:     {range: TimeStep, required: true}
  parent_unit:   {range: AtlSpatialUnit, description: "Zone → MPA, reach → basin. Optional."}

  # AtlObservationStream ---------------------------------------------------------------------------------------
  modality:         {range: Modality, required: true}
  source_system:    {range: string, required: true, description: "Ingest Rule 5: the system of record (FWC ArcGIS Hub, NOAA CoastWatch ERDDAP, USGS NWIS, NOAA CRW, OBIS, NCBI SRA…)."}
  source_id:        {range: string, required: true, description: "Ingest Rule 5: the id within that system (layer id, ERDDAP dataset id, NWIS site, BioProject)."}
  authority:        {range: uriorcurie, description: "The vocabulary the stream's variable is named in: CF standard name, WoRMS AphiaID, Darwin Core term."}
  variable:         {range: string, description: "The measured quantity as the authority names it (sea_surface_temperature; Karenia brevis; cells_per_litre)."}
  unit:             {range: string, description: "UCUM code (Cel; /L; m3/s; 1 for dimensionless)."}
  fetcher:          {range: string, description: "The atlantis_core fetcher class or module that realises this stream (P1)."}
  captured_at:      {range: datetime, description: "Ingest Rule 5: when the source produced/last updated the data."}
  ingested_at:      {range: datetime, description: "Ingest Rule 5: when the instance fetched it. Optional from 0.3.0 (M-1d-i operator ruling): a stream is DECLARED before its first fetch (contract item 6 — the self-test runs before any real data), and a declared stream has no fetch time to state. Required once the stream carries a sha256 (class rule on AtlObservationStream)."}
  pipeline_version: {range: string, description: "Ingest Rule 5: which fetcher version wrote the cache."}
  sha256:           {range: string, pattern: "^[a-f0-9]{64}(?!\\n)$", description: "Of the cached artifact; lowercase hex64. Required on AtlDataPin; recommended on a stream. Control: neg_sha256_not_hex64 (a 63-char hash on a data pin). Nearest miss NOT caught: a well-formed hash of the wrong bytes — only re-hashing the cache proves a pin."}
  row_count:        {range: integer, minimum_value: 0}
  license:          {range: string, required: true, description: "SPDX or the agency's terms string."}
  surveillance_channel: {range: boolean, description: "True if this stream's sampling intensity is itself endogenous to the event (pattern step 3; T5)."}

  # AtlVital ---------------------------------------------------------------------------------------------------
  stream_ref:     {range: AtlObservationStream, required: true}
  transform:      {range: string, required: true, description: "The feature recipe in words or a registry key (log10(1+x) weekly max; anomaly vs training-era climatology; rolling max)."}
  lag:            {range: integer, minimum_value: 0, description: "In time steps. 0 = the patient's current step."}
  window:         {range: integer, minimum_value: 1, description: "In time steps, for rolling transforms."}
  group:          {range: string, description: "Feature group for grouped SHAP and ablation (counts · surveillance · season · sst · discharge …)."}
  tag:            {range: VitalTag, required: true, description: "Closed enum. Control: neg_vital_tag_driver (`driver` — a causal word — rejected AT the tag; SHAP is never a cause). Nearest miss NOT caught: a lever/proxy tag that is wrong for the ecosystem (a review question, not a shape)."}
  owner:          {range: string, description: "REQUIRED and non-blank when tag = lever (AtlVital rule): who can move it (for the exemplar's S-79 releases, the Army Corps and the South Florida Water Management District, as the exemplar page names them; for a closure, the body that rules it)."}
  hypothesis_ref: {range: string, description: "Pointer to a hypothesis-ledger row (P3) when the vital exists because the literature asserted it."}
  monotone:       {range: integer, minimum_value: -1, maximum_value: 1, description: "Monotone constraint passed to the learner, only where physics is unambiguous. 0 = none."}

  # AtlEventDefinition -----------------------------------------------------------------------------------------
  threshold:      {range: float, required: true}
  direction:      {range: Direction, required: true}
  horizon:        {range: integer, required: true, minimum_value: 1, description: "In time steps: event within t+1 … t+horizon."}
  onset_rule:     {range: string, required: true, description: "How already-past-threshold patients are excluded (last-known state ≥ threshold → dropped) and how unknown outcomes are handled."}
  refractory_weeks: {range: integer, minimum_value: 0, description: "0.5.0 (M-2a-i). Optional; absent = 0. A patient-step is dropped as already-in-event when the carried signal crossed the threshold at ANY of t−R … t, not only at t — so a persistent or flickering event (DHW decaying and re-accumulating) yields one onset, not several. R = horizon − 1 matches eval's lead-time onset (no crossing in the previous H steps); R = horizon is one step stricter. Past-only by construction: the self-test's C1/C2 prove nothing after t moves it, and C9 that it bites at its declared length. Controls: pos_event_refractory · neg_event_refractory_negative · neg_event_refractory_float."}
  event_variable_stream: {range: AtlObservationStream, required: true, description: "The stream the event variable is read from."}

  # AtlEvaluation ----------------------------------------------------------------------------------------------
  event_ref:        {range: AtlEventDefinition, required: true}
  unit_ref:         {range: AtlSpatialUnit, description: "The patient population the evaluation covers (the parent unit when many)."}
  split:            {range: string, required: true, description: "Temporal split in words: train 1994–2016 · val 2017–2019 · test 2020–2023, scored once."}
  embargo_weeks:    {range: integer, minimum_value: 0, description: "0.6.0 (M-1f). The label-horizon embargo the evaluation's fit and stop sets were cut with: the rows whose label window t+1…t+H reads the period a set must not see were dropped (III M-1e F-6). 0 = none; ≥ the event horizon when on (atlantis_core refuses a partial embargo). Optional so that grandfathered entries (v0–v2, unembargoed and disclosed as such) still validate. It is E as resolved and applied, and the emitter states it only when every boundary was checked; what proves the cut is atlantis_core.board.assert_embargo (each boundary's label window ends before the year the split names, and it dropped at least the rows whose H-week window crosses), not this number (III M-1f F-3). Controls: pos_evaluation_embargo · neg_evaluation_embargo_negative · neg_evaluation_embargo_float. Nearest miss NOT caught: an embargo shorter than the horizon (H lives on the event, not the evaluation — cross-object arithmetic is the emitter's)."}
  n_test:           {range: integer, required: true, minimum_value: 1}
  n_positives:      {range: integer, required: true, minimum_value: 0}
  base_rate:        {range: float, required: true, minimum_value: 0, maximum_value: 1, description: "Test prevalence. REQUIRED — a score without its base rate is not a result (Proteus doctrine 2; SO-9). Controls: neg_missing_base_rate · neg_base_rate_gt1 (1.5). Nearest miss NOT caught: base_rate ≠ n_positives / n_test (cross-field arithmetic is a validator's job)."}
  auroc:            {range: float, minimum_value: 0, maximum_value: 1}
  auprc:            {range: float, minimum_value: 0, maximum_value: 1}
  brier:            {range: float, minimum_value: 0, maximum_value: 1}
  calibration_slope: {range: float}
  climatology_auroc: {range: float, minimum_value: 0, maximum_value: 1, description: "The cheapest baseline (T11). Required from M-1b on."}
  climatology_auprc: {range: float, minimum_value: 0, maximum_value: 1}
  persistence_auroc: {range: float, minimum_value: 0, maximum_value: 1, description: "0.7.0 (M-2b, ruling 19). The no-model, no-fit comparator: test rows ranked by the event signal itself at t, carried forward as the label carries it (`last_known_weeks`) — the honest floor where the event variable is also a vital (DHW accumulates, so DHW(t) nearly decides DHW(t+k); SO-9). Optional: entries before 0.7.0 still validate. Controls: pos_evaluation_baselines_and_segments · neg_persistence_auroc_gt1. Nearest miss NOT caught: a persistence score that read s(t+1) (a leak is the emitter's and its tests', not a shape's)."}
  persistence_auprc: {range: float, minimum_value: 0, maximum_value: 1, description: "0.7.0 (M-2b, ruling 19). As persistence_auroc. Controls: pos_evaluation_baselines_and_segments · neg_persistence_auprc_negative."}
  trend_auroc:      {range: float, minimum_value: 0, maximum_value: 1, description: "0.7.0 (M-2b, ruling 19). A logistic fit on [s(t), s(t) − s(t−1)] — the signal and its last step — fitted on the rows the refit trains on (train ∪ embargoed val, as climatology), scored once on test. What the model adds beyond the event signal's own recent path. Controls: pos_evaluation_baselines_and_segments · neg_trend_auroc_gt1. Nearest miss NOT caught: a trend fitted on test rows, or a step input that read s(t+1) (atlantis_core's: eval's fit_years and check_label_windows; plants B1 and S3 in tests/test_baselines.py, III M-2b F-1)."}
  trend_auprc:      {range: float, minimum_value: 0, maximum_value: 1, description: "0.7.0 (M-2b, ruling 19). As trend_auroc. Controls: pos_evaluation_baselines_and_segments · neg_trend_auprc_gt1."}
  base_rate_train:  {range: float, minimum_value: 0, maximum_value: 1, description: "0.7.0 (M-2b, ruling 16). Prevalence of the training years' modelling rows. With base_rate_validation and base_rate (test) it makes a non-stationary base rate visible: a threshold fixed on validation meets the test base rate, so a shift between segments moves every budget's realised precision (SO-9). Controls: pos_evaluation_baselines_and_segments · neg_base_rate_train_gt1. Nearest miss NOT caught: a rate ≠ that segment's positives / n (cross-field arithmetic is the emitter's)."}
  base_rate_validation: {range: float, minimum_value: 0, maximum_value: 1, description: "0.7.0 (M-2b, ruling 16). Prevalence of the validation years' modelling rows (the years every threshold is fixed on). Controls: pos_evaluation_baselines_and_segments · neg_base_rate_validation_negative."}
  calibration_in_the_large_validation: {range: float, minimum_value: -1, maximum_value: 1, description: "0.7.0 (M-2b, ruling 16). Mean predicted probability − observed prevalence on the validation stop set: 0 is calibrated in the large, > 0 over-predicts. Beside the test value it shows calibration under a base-rate shift. Controls: pos_evaluation_baselines_and_segments · neg_calibration_in_the_large_validation_gt1. Nearest miss NOT caught: a value that is not mean(p) − prevalence."}
  calibration_in_the_large_test: {range: float, minimum_value: -1, maximum_value: 1, description: "0.7.0 (M-2b, ruling 16). Mean predicted probability − observed prevalence on test. Controls: pos_evaluation_baselines_and_segments · neg_calibration_in_the_large_test_lt_minus1."}
  climatology_alert_budgets: {range: AtlAlertBudget, multivalued: true, inlined_as_list: true, description: "0.8.0 (M-2c-i; P2 gate III G-3, C-034). T11 at its terms: the week-of-year climatology scored at the same nominal budgets as the model, each threshold fixed on validation by a climatology fit on train only (embargoed), applied to the refit's test scores, with the realised rate beside the nominal one — the AtlAlertBudget rule (validation ⇒ realised_rate) applies here as on `alert_budgets`. Climatology scores tie in whole week-of-year groups, so the realised rate departs from the nominal one by construction. Optional: entries before 0.8.0 still validate. Controls: pos_evaluation_climatology_budget_and_interval · neg_climatology_budget_without_realised_rate. Nearest miss NOT caught: a threshold quantiled from test while labelled `validation` (atlantis_core: eval's invariance test and plant C1 in tests/test_m2c.py; board.assert_climatology_at_budget)."}
  paired_intervals: {range: AtlPairedInterval, multivalued: true, inlined_as_list: true, description: "0.8.0 (M-2c-i). model − comparator on a threshold-free metric, with a percentile interval from season-block draws (whole test years, the same draw scoring both: paired). Read with n_blocks: with B blocks only C(2B−1, B) distinct draws exist (35 at B = 4), so the interval is crude; one that spans 0 means 'not distinguished at this sample', never 'no difference'. Optional. Controls: pos_evaluation_climatology_budget_and_interval · neg_interval_extra_key (per-draw values cannot ride along). Nearest miss NOT caught: an interval whose draws were not paired (atlantis_core: the identical-scores control in tests/test_m2c.py fails under plant C4 — the proof is that control, not a guard; III M-2c-i F-8). The level is NOMINAL: at small n_blocks a percentile interval under-covers, so 'spans 0: no' is not 'distinguished at that level' (III M-2c-i F-2); the board carries the per-season deltas and a sign test beside it."}
  alert_budgets:    {range: AtlAlertBudget, multivalued: true, inlined_as_list: true, required: true, minimum_cardinality: 1, description: "At least one (T6; SO-9 — operator ruling at M-1c to enforce now, not at M-1b). Controls: neg_evaluation_without_budget (absent) · neg_evaluation_empty_budgets (`[]`). Nearest miss NOT caught: a budget whose precision/recall were not measured at that rate."}
  lead_time:        {range: AtlLeadTime, inlined: true}
  ablations:        {range: AtlAblation, multivalued: true, inlined_as_list: true, description: "Surveillance ablation is REQUIRED where a surveillance channel is declared (T5)."}
  learner:          {range: string, description: "xgboost 3.4.1 · depth 4 · eta 0.03 · logloss early-stop — or the swap."}
  config_hash:      {range: string, required: true, description: "Hash of the instance's config.yaml at training time."}
  data_pins:        {range: AtlDataPin, multivalued: true, inlined_as_list: true, description: "Every stream the model saw, with its sha256."}
  shap_summary_ref: {range: string, description: "Pointer to the instance's shap_summary (mean |SHAP| per vital and group); never per-patient values."}
  claim:            {range: Claim, required: true, ifabsent: "string(method_demonstration)", description: "SO-4. REQUIRED and written out: neither validator applies `ifabsent`, so an evaluation without `claim` is rejected rather than defaulted (the default documents intent for generators). Controls: neg_missing_claim · neg_unknown_claim."}
  owner_ruling_ref: {range: string, description: "REQUIRED and non-blank when claim = operational_by_owner_ruling (AtlEvaluation rule)."}
  limitations_ref:  {range: string, required: true, pattern: '\S', description: "Pointer to the published page's Limitations section. REQUIRED and non-blank: no evaluation without its limits (SO-4, SO-9). Controls: neg_missing_limitations_ref (absent) · neg_limitations_ref_blank (`'  '`). Nearest miss NOT caught: a pointer to a page with no Limitations section (referential integrity)."}

  # inlined parts ----------------------------------------------------------------------------------------------
  rate:         {range: float, required: true, minimum_value: 0, maximum_value: 1, description: "The NOMINAL alert rate — the budget (fraction of patient-steps the threshold was set to flag). Where the threshold was fixed beforehand (`threshold_from: validation`), the rate actually flagged on test is `realised_rate`."}
  realised_rate: {range: float, minimum_value: 0, maximum_value: 1, description: "0.4.0 (M-1e): the fraction of test patient-steps actually flagged at the threshold fixed beforehand — beside the nominal `rate`, never instead of it (SO-9). REQUIRED when threshold_from = validation (AtlAlertBudget rule). Controls: neg_realised_rate_gt1 (range) · neg_budget_validation_without_realised_rate · neg_budget_realised_rate_null. Nearest miss NOT caught: a realised rate that is not n_alerts / n_test (arithmetic across slots is the emitter's, not a schema's)."}
  threshold_from: {range: ThresholdSource, description: "0.4.0 (M-1e): where the alert threshold was fixed. Optional so that grandfathered entries (v0, v1: test quantiles, disclosed as F-8) still validate; atlantis_core.board refuses to EMIT `test`. Control: neg_unknown_threshold_from."}
  precision:    {range: float, required: true, minimum_value: 0, maximum_value: 1}
  recall:       {range: float, required: true, minimum_value: 0, maximum_value: 1}
  n_alerts:     {range: integer, minimum_value: 0}
  budget_rate:  {range: float, required: true, minimum_value: 0, maximum_value: 1, description: "The alert budget the lead time was measured at."}
  n_onsets:     {range: integer, required: true, minimum_value: 0}
  flagged_fraction: {range: float, required: true, minimum_value: 0, maximum_value: 1}
  median_lead:  {range: float, minimum_value: 0, description: "In time steps."}
  comparator:    {range: IntervalComparator, required: true, description: "0.8.0. Control: neg_interval_unknown_comparator."}
  metric:        {range: IntervalMetric, required: true, description: "0.8.0. Control: neg_interval_unknown_metric."}
  resample_unit: {range: ResampleUnit, required: true, description: "0.8.0. Control: neg_interval_resample_unit_row."}
  season_start_month: {range: integer, required: true, minimum_value: 1, maximum_value: 12, description: "0.8.0 (III M-2c-i F-5, ruling 5). The month a season-year starts in (1 = calendar year). A season is named by the year it starts; with a start month other than 1 the test window's edges are partial seasons, each a block. Controls: neg_interval_season_start_month_0 · neg_interval_season_start_month_13. Nearest miss NOT caught: a start month that cuts the instance's events in two (the steward's choice, disclosed)."}
  n_blocks:      {range: integer, required: true, minimum_value: 2, description: "0.8.0. The number of test seasons resampled. At least 2 (one season admits no resample). Control: neg_interval_n_blocks_1. Nearest miss NOT caught: n_blocks ≠ the test years the split names (atlantis_core: board.assert_interval)."}
  n_draws:       {range: integer, required: true, minimum_value: 1}
  n_degenerate:  {range: integer, minimum_value: 0, description: "0.8.0. Draws that held a single class and could score neither metric — counted and left out, never imputed."}
  confidence_level: {range: float, required: true, minimum_value: 0, maximum_value: 1, description: "0.8.0. The NOMINAL level of the percentile interval — not its delivered coverage, which is lower at few blocks (III M-2c-i F-2)."}
  delta_estimate: {range: float, required: true, minimum_value: -1, maximum_value: 1, description: "0.8.0. model − comparator on the full test set. Control: neg_interval_estimate_lt_minus1."}
  delta_lower:   {range: float, required: true, minimum_value: -1, maximum_value: 1, description: "0.8.0. Control: neg_interval_lower_lt_minus1. Nearest miss NOT caught: delta_lower > delta_upper (cross-slot arithmetic; atlantis_core: board.assert_interval)."}
  delta_upper:   {range: float, required: true, minimum_value: -1, maximum_value: 1, description: "0.8.0. Control: neg_interval_upper_gt_1."}
  spans_zero:    {range: boolean, required: true, description: "0.8.0. True when delta_lower ≤ 0 ≤ delta_upper — reported as exactly that. Control: neg_interval_without_spans_zero. Nearest miss NOT caught: a flag that disagrees with the bounds (atlantis_core: board.assert_interval)."}
  ablation_name: {range: string, required: true, description: "What was removed (the surveillance group; a stream; a lever)."}
  ablated_auroc: {range: float, minimum_value: 0, maximum_value: 1}
  ablated_auprc: {range: float, minimum_value: 0, maximum_value: 1}

  # AtlHypothesis (0.9.0, M-3b-i) ------------------------------------------------------------------------------
  # The hypotheses README §A row. Slot names that would collide with an existing slot of another range (direction, lag,
  # threshold, stream_ref) are prefixed (driver_*, lag_*, threshold_*, realised_*) rather than overridden by slot_usage.
  ecosystem_type:   {range: EcosystemType, required: true, description: "0.9.0. The join key (README rule 5); also the ledger directory name (atlantis_core check). Control: neg_hypothesis_unknown_ecosystem."}
  event_variable:   {range: string, required: true, description: "0.9.0. The event the claim bears on, as the instance names it (degree_heating_week; a WoRMS taxon). Free text: a hypothesis may be read before any instance declares the event."}
  mechanism:        {range: string, required: true, pattern: '\S', description: "0.9.0. One sentence: the paper's claim in the paper's terms. Control: neg_hypothesis_mechanism_blank."}
  driver:           {range: AtlHypothesisDriver, required: true, inlined: true, description: "0.9.0. Control: neg_hypothesis_without_driver."}
  region_asserted:  {range: string, required: true, description: "0.9.0. Where the paper looked (a region name; never coordinates)."}
  evidence_class:   {range: EvidenceClass, required: true, description: "0.9.0. Control: neg_hypothesis_unknown_evidence_class."}
  citation:         {range: AtlCitation, required: true, inlined: true}
  sentence_pointer: {range: string, required: true, pattern: '\S', description: "0.9.0. README rule 1 — no pointer, no row: a section/paragraph, or a quotation of ≤ 25 words. Controls: neg_hypothesis_without_sentence_pointer (absent) · neg_hypothesis_sentence_pointer_blank. Nearest miss NOT caught: a quotation over 25 words, or one not in the paper (atlantis_core.hypotheses check: word count always; verbatim against the cached text when the cache is present)."}
  hypothesis_source: {range: HypothesisSource, required: true, description: "0.9.0. Control: neg_hypothesis_unknown_source."}
  realisable_as:    {range: string, required: true, pattern: '\S', description: "0.9.0 (skill step 4). The candidate vital in stream-class terms (source · transform · lag), or `unrealisable: <why>` — T8's falsifier made visible (rows no fetcher can realise). Control: neg_hypothesis_realisable_as_blank."}
  realisability:    {range: Realisability, required: true, description: "0.9.0 (III M-3b-i F-4). Controls: neg_hypothesis_unknown_realisability · neg_hypothesis_without_realisability."}
  reviewed_sha256:  {range: string, pattern: "^[a-f0-9]{64}(?!\\n)$", description: "0.9.0 (III M-3b-i F-3). The sha256 of the row as the reviewer read it (canonical JSON of the row minus tier, reviewed_by and reviewed_sha256), written at promotion; atlantis_core check recomputes it and fails reviewed_content_changed, so `reviewed` stays bound to what was reviewed. Control: neg_hypothesis_reviewed_sha256_malformed. Nearest miss NOT caught: a hash written without a review (the reader's id is the record of who read)."}
  realisation:      {range: AtlRealisation, required: true, inlined: true, description: "0.9.0. Present on every row (`result: untested` until an instance realises it); filled when an instance turns the row into a vital. Required, not optional: an optional inlined object is emitted anyOf [object, null], and a defect inside it would be rejected only as an unnamed branch (the controls could not name it)."}
  reviewed_by:      {range: string, description: "0.9.0. Who confirmed the extraction is faithful to the cited text. REQUIRED and non-blank when tier = reviewed (AtlHypothesis rule). Nearest miss NOT caught: a reviewer who is the extractor (atlantis_core check), or `validated` with fewer than two reviewers (atlantis_core check refuses `validated` until a second-reviewer slot exists)."}
  driver_lag:       {range: AtlLagSpec, required: true, inlined: true, description: "0.9.0. Required: a realisation needs a lag. A paper that states none is recorded as lag_value 0 with lag_note `not stated — concurrent`, or an inferred lag with `inferred: <how>` (the skill, step 3). Required for the same reason as realisation."}
  driver_direction: {range: DriverDirection, required: true, description: "0.9.0. Control: neg_hypothesis_unknown_direction."}
  driver_threshold: {range: AtlThresholdSpec, inlined: true}
  lag_value:        {range: float, required: true, minimum_value: 0, description: "0.9.0. Control: neg_hypothesis_lag_negative."}
  lag_unit:         {range: LagUnit, required: true, description: "0.9.0. Control: neg_hypothesis_unknown_lag_unit."}
  lag_note:         {range: string, description: "0.9.0. `as stated` or `inferred: <how>`."}
  threshold_value:  {range: float, required: true}
  threshold_unit:   {range: string, required: true, description: "UCUM."}
  doi:              {range: string, pattern: "^10\\.[0-9]{4,9}/\\S+(?!\\n)$", description: "0.9.0. A bare DOI (10.xxxx/…), no resolver prefix. Control: neg_hypothesis_doi_malformed (a `https://doi.org/` prefix). Required unless `url` is given (AtlCitation rule)."}
  url:              {range: string, pattern: "^https?://\\S+(?!\\n)$", description: "0.9.0. For a work with no DOI (an agency report). Control: neg_hypothesis_url_malformed."}
  title:            {range: string, required: true}
  year:             {range: integer, required: true, minimum_value: 1800, maximum_value: 2100, description: "0.9.0. Control: neg_hypothesis_year_out_of_range."}
  citation_source:  {range: CitationSource, required: true, description: "0.9.0. Control: neg_hypothesis_unknown_citation_source."}
  realised_in:      {range: string, description: "0.9.0. The instance (vault name) that realised the row."}
  realised_vital:   {range: string, pattern: "^atl_vital_[a-z0-9_]{2,64}(?!\\n)$", description: "0.9.0. The AtlVital whose hypothesis_ref names this row."}
  realised_stream:  {range: string, pattern: "^atl_stream_[a-z0-9_]{2,64}(?!\\n)$"}
  tested_at:        {range: date}
  result:           {range: RealisationResult, required: true, description: "0.9.0. Control: neg_hypothesis_unknown_result."}
  shap_mean_abs:    {range: float, minimum_value: 0, description: "0.9.0. Mean |SHAP| of the realised vital (or its group) on test — a summary, never per-patient."}
  write_up:         {range: string, description: "0.9.0. Memo or board-entry pointer — written either way (T8)."}

  # document container -----------------------------------------------------------------------------------------
  spatial_units:        {range: AtlSpatialUnit, multivalued: true, inlined_as_list: true}
  observation_streams:  {range: AtlObservationStream, multivalued: true, inlined_as_list: true}
  vitals:               {range: AtlVital, multivalued: true, inlined_as_list: true}
  event_definitions:    {range: AtlEventDefinition, multivalued: true, inlined_as_list: true}
  evaluations:          {range: AtlEvaluation, multivalued: true, inlined_as_list: true}
  hypotheses:           {range: AtlHypothesis, multivalued: true, inlined_as_list: true, description: "0.9.0. For controls and bulk validation; a ledger row file holds ONE hypothesis at top level, validated -C AtlHypothesis."}

# ---------------------------------------------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------------------------------------------
classes:

  AtlDocument:
    tree_root: true
    description: Container used to validate instance registry files; any file may carry any subset.
    slots: [spatial_units, observation_streams, vitals, event_definitions, evaluations, hypotheses]

  AtlDeclared:
    abstract: true
    description: Mixin — every declared object carries a tier, a version and who/when.
    slots: [name, description, tier, version, recorded_by, recorded_at]

  AtlSpatialUnit:
    is_a: AtlDeclared
    description: >-
      The patient's space — one of these × one time step is a patient row. Passes the instance test (an MPA zone is
      countable), independence (it outlives any model) and lifecycle (boundaries change by ruling, versioned).
      Geometry is a pointer: Atlantis never holds a polygon.
    slots: [unit_id, unit_kind, external_id, geometry_ref, time_step, parent_unit]
    slot_usage:
      external_id:
        description: "SHOULD be present when unit_kind = mpa_zone. NOT ENFORCED: LinkML rules have no warning severity, and an error would be wrong (some zones have no WDPA row). A validator's warning (README §Known limits). Positive: pos_mpa_zone_wdpa."

  AtlObservationStream:
    is_a: AtlDeclared
    description: >-
      One source of observations with Ingest-Rule-5 provenance and a content hash. The stream is the unit of
      fetch, cache, licence and drift detection. Observations themselves are a table shape (observation_long,
      type-vocabulary proposal) and never enter Atlantis.
    slots: [stream_id, modality, source_system, source_id, authority, variable, unit, fetcher, captured_at, ingested_at, pipeline_version, sha256, row_count, license, surveillance_channel]
    rules:
      - preconditions:
          slot_conditions:
            sha256: {value_presence: PRESENT}
        postconditions:
          slot_conditions:
            ingested_at: {required: true, all_of: [{range: datetime}]}
        description: >-
          A hash names a fetch (0.3.0, M-1d-i). A stream that pins cached bytes says when they landed; a stream with no
          sha256 is DECLARED (not yet fetched) and may omit ingested_at. The all_of arm is load-bearing for the same reason
          as the lever rule's (M-1c Finding 1): the optional slot is emitted `["string","null"]`, so a bare `required`
          lets `ingested_at:` (null) through. A blank string is already refused by the slot's own date-time range.
          Controls: pos_stream_declared_prefetch · neg_sha256_without_ingested_at (absent) · neg_stream_ingested_at_null (null).
          Nearest miss NOT caught: the converse — a stream with ingested_at but no sha256 (fetched, unpinned) validates;
          contract item 3's FETCHED stage (atlantis_core.conform) requires both. Also not caught: a fetch time that
          predates the source's captured_at, or a hash of the wrong bytes.

  AtlVital:
    is_a: AtlDeclared
    description: >-
      One feature on the patient grid: where it comes from, how it is made, what it is for. Replaces the exemplar's
      hard-coded FEATURE_GROUPS / FEATURE_DOC (P1 M-1b). The tag is reviewable here instead of buried in code.
    slots: [vital_id, stream_ref, transform, lag, window, group, tag, owner, hypothesis_ref, monotone]
    rules:
      - preconditions:
          slot_conditions:
            tag: {equals_string: lever}
        postconditions:
          slot_conditions:
            owner: {required: true, all_of: [{range: string, pattern: '\S'}]}
        description: >-
          A lever names its owner. The all_of arm is load-bearing: a bare `required` lets `owner: null` / `owner: ''`
          through BOTH validators (gen-json-schema emits the postcondition untyped), found at M-1c. Controls:
          neg_lever_without_owner (absent) · neg_lever_owner_null (YAML `owner:` → null) · neg_lever_owner_blank.
          Nearest miss NOT caught: an
          owner string that names nobody real, or nobody who can move THIS lever on THIS horizon.

  AtlEventDefinition:
    is_a: AtlDeclared
    description: >-
      Threshold · direction · horizon · onset rule. A ruling with its own version history; a second event on the
      same vitals is a second definition and a second model (T12).
    slots: [event_id, event_variable_stream, threshold, unit, direction, horizon, onset_rule, refractory_weeks]

  AtlEvaluation:
    is_a: AtlDeclared
    description: >-
      The measurement is the artifact (ADR-057). Always against its base rate, at a budget, with lead time, with its
      ablations, with its data pins and its limitations. This is what crosses to the board — metrics only. CLOSED
      (gen-json-schema --closed; linkml-validate is closed by default): control neg_per_patient_predictions proves a
      per-patient `predictions` list is rejected AT the evaluation; neg_budget_extra_key (a part) and
      neg_document_extra_key (the root) prove closed-ness at the other two levels. Nearest miss NOT caught: per-patient values
      smuggled inside a declared free-text slot (e.g. `split`, `learner`) — a reviewer's catch, not a shape's.
    slots: [evaluation_id, event_ref, unit_ref, split, embargo_weeks, n_test, n_positives, base_rate, auroc, auprc, brier, calibration_slope,
            climatology_auroc, climatology_auprc, persistence_auroc, persistence_auprc, trend_auroc, trend_auprc,
            base_rate_train, base_rate_validation, calibration_in_the_large_validation, calibration_in_the_large_test,
            climatology_alert_budgets, paired_intervals, alert_budgets, lead_time, ablations, learner, config_hash, data_pins,
            shap_summary_ref, claim, owner_ruling_ref, limitations_ref]
    rules:
      - preconditions:
          slot_conditions:
            claim: {equals_string: operational_by_owner_ruling}
        postconditions:
          slot_conditions:
            owner_ruling_ref: {required: true, all_of: [{range: string, pattern: '\S'}]}
        description: >-
          An operational claim cites the owner's ruling (SO-4). Same all_of guard as the lever rule. Controls:
          neg_operational_without_ruling (absent) · neg_operational_ruling_null (null) · neg_operational_ruling_blank. Positive: pos_operational_with_ruling. Nearest miss NOT caught: a ruling path
          that does not exist, or a ruling that does not name the agencies that run the real forecast (referential
          integrity and content are a validator's and a reviewer's, not a schema's).

  AtlAlertBudget:
    description: Precision and recall at one alert rate — nominal, and (0.4.0) realised where the threshold was fixed beforehand.
    slots: [rate, precision, recall, n_alerts, threshold_from, realised_rate]
    rules:
      - preconditions:
          slot_conditions:
            threshold_from: {equals_string: validation}
        postconditions:
          slot_conditions:
            realised_rate: {required: true, all_of: [{range: float}]}
        description: >-
          A threshold fixed on validation states what it actually flagged on test (M-1e, F-8; SO-9). Typed all_of guard,
          as the lever and operational rules (M-1c: a bare-`required` postcondition is emitted untyped and lets null
          through). Controls: neg_budget_validation_without_realised_rate (absent) · neg_budget_realised_rate_null (null).
          Positive: pos_budget_fixed_on_validation. Nearest miss NOT caught: a budget that omits `threshold_from`
          altogether (the grandfathered shape) — the board emitter refuses that for every new entry.

  AtlPairedInterval:
    description: >-
      0.8.0 (M-2c-i). model − comparator on one metric, by season-block resampling: whole test years drawn with
      replacement, one draw scoring both. Summaries only; the draws stay in the instance. CLOSED: control
      neg_interval_extra_key proves an undeclared key (a per-draw list) is rejected AT the interval.
    slots: [comparator, metric, resample_unit, season_start_month, n_blocks, n_draws, n_degenerate, confidence_level, delta_estimate,
            delta_lower, delta_upper, spans_zero]

  AtlLeadTime:
    description: Lead-time summary at one budget. Histogram stays in the instance. (0.4.0) `threshold_from` says where the threshold it reads was fixed.
    slots: [budget_rate, n_onsets, flagged_fraction, median_lead, threshold_from]

  AtlAblation:
    description: One ablation result.
    slots: [ablation_name, ablated_auroc, ablated_auprc]

  AtlDataPin:
    description: One stream the model saw, pinned by hash.
    slots: [stream_ref, sha256]
    slot_usage:
      sha256: {required: true}

  AtlHypothesis:
    is_a: AtlDeclared
    description: >-
      0.9.0 (M-3b-i). One claim from the literature about what drives an event — mechanism · driver · lag · direction ·
      threshold · evidence class · citation — pointing at a sentence, and saying what vital would realise it. A
      hypothesis, not a fact: `tier: validated` would mean two reviewers agree the extraction is faithful, never that the
      mechanism is true; truth is the instance's SHAP and the write-up's job (README rule 2). CLOSED: control
      neg_hypothesis_extra_key proves an undeclared key (an abstract pasted in) is rejected AT the row. Nearest miss NOT
      caught: a long quotation pasted INTO sentence_pointer or mechanism (atlantis_core check counts the pointer's words;
      mechanism is a reviewer's catch).
    slots: [hyp_id, ecosystem_type, event_variable, mechanism, driver, region_asserted, evidence_class, citation,
            sentence_pointer, hypothesis_source, realisable_as, realisability, realisation, reviewed_by, reviewed_sha256]
    rules:
      - preconditions:
          slot_conditions:
            tier: {equals_string: reviewed}
        postconditions:
          slot_conditions:
            reviewed_by: {required: true, all_of: [{range: string, pattern: '\S'}]}
        description: >-
          A reviewed row names its reviewer. Same typed all_of guard as the lever rule (M-1c Finding 1). Controls:
          neg_hypothesis_reviewed_without_reviewer (absent) · neg_hypothesis_reviewer_null (null) · neg_hypothesis_reviewer_blank. Positive:
          pos_hypothesis_reviewed. Nearest miss NOT caught: reviewed_by = recorded_by (atlantis_core check).

  AtlHypothesisDriver:
    description: 0.9.0. The driver variable as an authority names it, with its lag, direction and optional threshold.
    slots: [variable, authority, driver_lag, driver_direction, driver_threshold]
    slot_usage:
      variable: {required: true, description: "The driver as the authority names it (wind_speed; Niño 3.4; cloud_area_fraction)."}

  AtlLagSpec:
    description: 0.9.0. A lag as the paper states it.
    slots: [lag_value, lag_unit, lag_note]

  AtlThresholdSpec:
    description: 0.9.0. A threshold the paper names.
    slots: [threshold_value, threshold_unit]

  AtlCitation:
    description: 0.9.0. The cited work. Its DOI (or URL) must appear in the ledger's corpus manifest (atlantis_core check).
    slots: [doi, url, title, year, citation_source]
    rules:
      - preconditions:
          slot_conditions:
            doi: {value_presence: ABSENT}
        postconditions:
          slot_conditions:
            url: {required: true, all_of: [{range: string, pattern: "^https?://\\S+(?!\\n)$"}]}
        description: >-
          A citation without a DOI gives a URL. Controls: neg_hypothesis_citation_without_doi_or_url (neither) ·
          pos_hypothesis_agency_url (URL only). Nearest misses NOT caught: `doi: null` (YAML `doi:`) with no URL — the
          ABSENT precondition is emitted `not required`, and a null key is present (atlantis_core check:
          citation_without_doi_or_url); a URL that does not resolve, or names another work.

  AtlRealisation:
    description: 0.9.0. The loop closed in an instance — realised, tested, written up either way.
    slots: [realised_in, realised_vital, realised_stream, tested_at, result, shap_mean_abs, write_up]
