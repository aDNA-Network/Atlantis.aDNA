# NEGATIVE — M-1c (III review). An evaluation id without `atl_eval_`. MUST FAIL, and only on this.
# REJECTS_ON: does not match '\^atl_eval_
# REJECTS_AT: ^/evaluations/0/evaluation_id$
evaluations:
  - evaluation_id: eval_example
    event_ref: atl_event_example
    split: "train 2000-2015 · test 2016-2020, scored once"
    n_test: 100
    n_positives: 10
    base_rate: 0.1
    alert_budgets: [{rate: 0.1, precision: 0.4, recall: 0.4}]
    config_hash: "0000000000"
    claim: method_demonstration
    limitations_ref: "site/example.html#limits"
