# NEGATIVE — M-2c-i (atl_v0 0.8.0). A delta below −1 — no difference of two metrics in [0, 1] can be. MUST FAIL, and only on this.
# REJECTS_ON: -1\.5 is less than the minimum of -1
# REJECTS_AT: ^/evaluations/0/paired_intervals/0/delta_lower$
evaluations:
  - evaluation_id: atl_eval_example
    event_ref: atl_event_example
    split: "train 2000-2015 · val 2016-2017 · test 2018-2021, scored once; label-horizon embargo 4 wk"
    embargo_weeks: 4
    n_test: 100
    n_positives: 15
    base_rate: 0.15
    climatology_auroc: 0.6
    climatology_auprc: 0.2
    climatology_alert_budgets: [{rate: 0.1, precision: 0.2, recall: 0.13, n_alerts: 12, threshold_from: validation, realised_rate: 0.12}]
    paired_intervals:
      - {comparator: climatology, metric: auroc, resample_unit: season_year, n_blocks: 4, n_draws: 2000, n_degenerate: 0, confidence_level: 0.95, delta_estimate: 0.2, delta_lower: -1.5, delta_upper: 0.4, spans_zero: true}
      - {comparator: climatology, metric: auprc, resample_unit: season_year, n_blocks: 4, n_draws: 2000, n_degenerate: 0, confidence_level: 0.95, delta_estimate: 0.25, delta_lower: 0.1, delta_upper: 0.5, spans_zero: false}
    alert_budgets: [{rate: 0.1, precision: 0.5, recall: 0.4, n_alerts: 8, threshold_from: validation, realised_rate: 0.08}]
    config_hash: "0000000000"
    claim: method_demonstration
    limitations_ref: "site/example.html#limits"
