# NEGATIVE — M-1e. A realised alert rate above 1. MUST FAIL, and only on this.
# REJECTS_ON: 1\.2 is greater than the maximum of 1
# REJECTS_AT: ^/evaluations/0/alert_budgets/0/realised_rate$
evaluations:
  - evaluation_id: atl_eval_example
    event_ref: atl_event_example
    split: "train 2000-2015 · val 2016-2017 · test 2018-2020, scored once"
    n_test: 100
    n_positives: 10
    base_rate: 0.1
    alert_budgets: [{rate: 0.1, precision: 0.5, recall: 0.4, n_alerts: 8, threshold_from: validation, realised_rate: 1.2}]
    lead_time: {budget_rate: 0.1, n_onsets: 5, flagged_fraction: 0.6, median_lead: 3.0, threshold_from: validation}
    config_hash: "0000000000"
    claim: method_demonstration
    limitations_ref: "site/example.html#limits"
