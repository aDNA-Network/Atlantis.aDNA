# REJECTS_ON: -1 is less than the minimum of 0
# REJECTS_AT: ^/event_definitions/0/refractory_weeks$
event_definitions:
  - event_id: atl_event_example
    event_variable_stream: atl_stream_example
    threshold: 4
    direction: above
    horizon: 8
    onset_rule: "drop patient-steps already past threshold; drop unknown outcomes"
    refractory_weeks: -1
